<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        header {
            background: #1e293b;
            padding: 15px;
            text-align: center;
        }

        nav a {
            margin: 0 10px;
            color: #38bdf8;
            text-decoration: none;
        }

        .hero {
            padding: 60px;
            text-align: center;
        }

        .hero h1 {
            font-size: 40px;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: #38bdf8;
            color: black;
            cursor: pointer;
            border-radius: 8px;
        }

        button:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>

<header>
    <h2>Success Website</h2>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Welcome Bro 👋</h1>
    <p>This is your first website</p>
    <button onclick="showMessage()">Click Me</button>
</section>

<script>
    function showMessage() {
        alert("You just clicked a button 🚀");
    }
</script>

</body>
</html>
